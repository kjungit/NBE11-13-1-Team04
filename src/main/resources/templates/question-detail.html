<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Bean - 문의 상세</title>
  <link rel="stylesheet" href="/css/user-style.css">
</head>
<body>
<div class="user-layout">
  <header class="user-header">
    <div class="header-container">
      <a href="/" class="brand-logo">☕ Coffee Bean</a>
      <nav class="user-nav">
        <a href="/orders/new">상품 주문</a>
        <a href="/orders">주문 내역</a>
        <a href="/questions/new" class="active">1:1 문의하기</a>
      </nav>
    </div>
  </header>

  <main class="user-main">
    <div class="page-header">
      <h2>📄 문의 상세 보기</h2>
      <p>접수하신 문의 내용과 답변을 확인합니다.</p>
    </div>

    <section class="user-card detail-card">
      <!-- 질문 정보 -->
      <div class="question-header">
        <span id="questionStatus" class="badge">상태</span>
        <h3 id="questionTitle" class="question-title-text">-</h3>
        <span id="questionCreatedAt" class="date-text">-</span>
      </div>

      <hr class="divider">

      <div class="content-box">
        <h4>문의 내용</h4>
        <p id="questionContent" class="body-text">-</p>
      </div>

      <!-- 답변 영역 -->
      <div id="answerContainer" class="answer-box" style="display: none;">
        <hr class="divider">
        <div class="answer-header">
          <h4>☕ Coffee Bean 답변</h4>
          <span id="answerCreatedAt" class="date-text">-</span>
        </div>
        <p id="answerContent" class="body-text">-</p>
      </div>

      <div class="action-buttons margin-top-20">
        <button class="btn-outline" onclick="goBackToList()">목록으로 돌아가기</button>
      </div>
    </section>
  </main>
</div>

<script src="/js/question-detail.js"></script>
</body>
</html>
