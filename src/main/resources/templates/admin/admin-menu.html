<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Coffee Bean Admin - Menu</title>
    <link rel="stylesheet" href="/css/admin-menu.css">
</head>
<body>
<div class="admin-container">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <div class="logo">
            <h2>☕ Coffee Bean</h2>
            <span>Admin System</span>
        </div>
        <nav class="menu-list">
            <a href="/admin/menu" class="active">📋 메뉴 관리</a>
            <a href="#" onclick="alert('준비 중인 기능입니다.')">🛍️ 주문 관리</a>
            <a href="#" onclick="alert('준비 중인 기능입니다.')">📊 매출 통계</a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()">🔓 로그아웃</button>
        </div>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-content">
        <header class="content-header">
            <h1>📋 메뉴 관리</h1>
            <p>커피빈의 메뉴 등록 및 수정, 삭제를 관리하는 페이지입니다.</p>
        </header>

        <section class="content-body">
            <!-- 메뉴 추가 폼 카드 -->
            <div class="admin-card text-right">
                <button class="btn-primary" onclick="openAddModal()">✨ 새 메뉴 등록</button>
            </div>

            <!-- 메뉴 리스트 테이블 카드 -->
            <div class="admin-card">
                <table class="menu-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>카테고리</th>
                        <th>메뉴명</th>
                        <th>가격</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody id="menuTableBody">
                    <!-- JS에서 동적으로 렌더링되거나 서버 사이드 템플릿으로 채워질 영역 -->
                    <tr>
                        <td>1</td>
                        <td><span class="badge">Coffee</span></td>
                        <td><strong>아메리카노</strong></td>
                        <td>4,500원</td>
                        <td><span class="status-badge available">판매중</span></td>
                        <td>
                            <button class="btn-sm btn-outline" onclick="editMenu(1)">수정</button>
                            <button class="btn-sm btn-danger" onclick="deleteMenu(1)">삭제</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td><span class="badge">Coffee</span></td>
                        <td><strong>카페라떼</strong></td>
                        <td>5,000원</td>
                        <td><span class="status-badge soldout">품절</span></td>
                        <td>
                            <button class="btn-sm btn-outline" onclick="editMenu(2)">수정</button>
                            <button class="btn-sm btn-danger" onclick="deleteMenu(2)">삭제</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="/js/admin-menu.js"></script>
</body>
</html>
