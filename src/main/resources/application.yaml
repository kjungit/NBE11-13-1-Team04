spring:
  application:
    name: Cafe Menu Management

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cafe_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: ./uploads/products

logging:
  level:
    com:
      example:
        product:
            DEBUG